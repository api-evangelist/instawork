aid: instawork
name: Instawork
description: >-
  Instawork is a flexible-staffing marketplace that connects businesses in
  hospitality, warehouse, events, retail, and food service with vetted hourly
  workers ("Pros") for short-term shifts across the USA and Canada. Businesses
  post or rebook shifts and Instawork's ML-driven "Smart assign" matching fills
  them, often within hours. Instawork's developer surface is agent-native:
  rather than a public REST API it ships a hosted Partner MCP server
  (finch.instawork.com/mcp/partner) secured with OAuth 2.1, plus a published
  Agent Skill (github.com/instawork/skills) that lets AI assistants such as
  Claude and Cursor search locations and positions, price shifts, and create
  bookings on a business partner's behalf. Backed by Craft Ventures, Greylock,
  GV, and Y Combinator.
