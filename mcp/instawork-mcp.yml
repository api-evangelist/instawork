  install:
    claude_code: claude mcp add instawork-partner -- npx mcp-remote https://finch.instawork.com/mcp/partner/
    mcp_json: "{\n  \"mcpServers\": {\n    \"instawork-partner\": {\n      \"command\": \"npx\",\n   \
      \   \"args\": [\"mcp-remote\", \"https://finch.instawork.com/mcp/partner/\"]\n    }\n  }\n}\n"
